name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate synthetic gateway traffic
        run: make devices
      - name: Run the pipeline end-to-end (moto-mocked AWS)
        run: make pipeline
      - name: Render the operations dashboard
        run: make dashboard
      - name: Unit and behavior tests
        run: make test
      - name: Publish dashboard as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-dashboard
          path: dashboard.html
